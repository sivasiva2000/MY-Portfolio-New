name: Deploy to GitHub Pages

# Builds on every push to main and publishes the result to Pages, so the live
# site can no longer drift out of sync with the source (which is what left it
# serving a stale, broken build before).
#
# Requires: Settings -> Pages -> Source = "GitHub Actions".
# Note this replaces deploying from the `build` branch; that branch is no longer
# read by Pages once the Source is switched.

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-deploy by hand without pushing

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a publish midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
